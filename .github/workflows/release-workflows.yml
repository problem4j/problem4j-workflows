# Manually triggered release of this repository, not a reusable workflow. Releases are plain git tags - no GitHub
# releases are created.
#
# 1. Compute Version - bumps the chosen part (patch, minor or major) of the highest vX.Y.Z git tag; the first release
#    bumps from 0.0.0 (v0.0.1, v0.1.0 or v1.0.0). Refuses to run outside of main, on an already released commit, or
#    when the tag already exists.
# 2. Push Tags - creates the annotated vX.Y.Z git tag ("Release X.Y.Z") on the current commit and moves the major
#    version tag vX to it, when it is the highest release of that major version, so callers referencing @vX get it.

name: Release Workflows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        default: "patch"

concurrency:
  group: release-workflows
  cancel-in-progress: false

permissions: {}

jobs:
  release-workflows:
    name: Release Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be made from main, got $GITHUB_REF"
            exit 1
          fi

          released=$(git tag --points-at HEAD | grep -E "$release_tag" || true)
          if [ -n "$released" ]; then
            echo "::error::Commit $GITHUB_SHA is already released as $released"
            exit 1
          fi

          highest=$(git tag -l | grep -E "$release_tag" | sort -V | tail -n 1 || true)
          echo "Highest release: ${highest:-none}"

          IFS=. read -r major minor patch <<< "${highest#v}"
          major="${major:-0}" minor="${minor:-0}" patch="${patch:-0}"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # The vX tag moves only when this is the highest release of its major version.
          major_tag="v${version%%.*}"
          major_highest=$(printf '%s\n%s\n' "$(git tag -l | grep -E "$release_tag" || true)" "$tag" \
            | grep -E "^$major_tag\." | sort -V | tail -n 1)
          is_major_latest=$([ "$major_highest" = "$tag" ] && echo true || echo false)

          echo "::notice::Releasing $tag from commit $GITHUB_SHA (previous: ${highest:-none})"
          echo "Highest of major $major_tag: $is_major_latest"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "major-tag=$major_tag"
            echo "is-major-latest=$is_major_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Push Tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR_TAG: ${{ steps.version.outputs.major-tag }}
          IS_MAJOR_LATEST: ${{ steps.version.outputs.is-major-latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          refs=("refs/tags/$TAG")
          tags="$TAG"
          git tag --annotate "$TAG" --message "Release $VERSION" "$GITHUB_SHA"
          if [ "$IS_MAJOR_LATEST" = "true" ]; then
            git tag --force --annotate "$MAJOR_TAG" --message "Release $VERSION" "$GITHUB_SHA"
            refs+=("+refs/tags/$MAJOR_TAG")
            tags="$tags $MAJOR_TAG"
          fi

          git push --atomic origin "${refs[@]}"
          echo "Pushed tags: $tags"
